version: 1
lanes:
  - lane_id: ashare
    worktree_basename: market-ashare
    branch: codex/market-ashare-lane
    authority_id: ashare-capital-v1
    authority_state: current_verified_simulated
    broker_boundary:
      simulation_contract: tradingagent.ashare.paper_broker.v1
      external_test_contracts: []
      future_live_adapter_family: ashare.broker_specific.unimplemented
      live_enabled: false
    owned_paths:
      - Ashare/**
      - tests/test_ashare_*.py
      - tests/test_mainboard_*.py
    handoff_only_paths:
      - shared/**
      - CNFutures/**
      - Crypto/**
      - front/**
      - docs/**
      - AGENTS.md
      - README.md
      - STATUS.md

  - lane_id: cnfutures
    worktree_basename: market-cnfutures
    branch: codex/market-cnfutures-lane
    authority_id: cn-futures-capital-v1
    authority_state: current_verified_simulated
    broker_boundary:
      simulation_contract: tradingagent.cnfutures.paper_broker.v1
      external_test_contracts: []
      future_live_adapter_family: cnfutures.ctp_or_broker_specific.unimplemented
      live_enabled: false
    owned_paths:
      - CNFutures/**
      - tests/test_cn_futures_*.py
    handoff_only_paths:
      - shared/**
      - Ashare/**
      - Crypto/**
      - front/**
      - docs/**
      - AGENTS.md
      - README.md
      - STATUS.md

  - lane_id: crypto
    worktree_basename: market-crypto
    branch: codex/market-crypto-lane
    authority_id: crypto-shadow-sim-v1
    authority_state: isolated_shadow_only
    broker_boundary:
      simulation_contract: tradingagent.crypto.paper_broker.v1
      external_test_contracts:
        - tradingagent.crypto.binance_spot_testnet.v1
      future_live_adapter_family: crypto.binance_spot_live.unimplemented
      live_enabled: false
    owned_paths:
      - Crypto/**
      - tests/test_crypto_*.py
    handoff_only_paths:
      - shared/**
      - Ashare/**
      - CNFutures/**
      - front/**
      - docs/**
      - AGENTS.md
      - README.md
      - STATUS.md
