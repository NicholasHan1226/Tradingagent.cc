name: One-shot Crypto C3 Pending Semantics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'codex/crypto-c3-pending-semantics-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - run: |
          git config user.name 'TradingAgent Crypto Contract Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Migrate Stage-2 machine-readable lifecycle semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gen=Path('Crypto/ten_symbol_hypothesis_generator.py')
          text=gen.read_text(encoding='utf-8')
          text=text.replace(
              'immutable, checksum-bound *registration proposal* artifact for human review.',
              'immutable, checksum-bound *registration proposal* artifact awaiting the C3 automatic scientific gate.',
          )
          text=text.replace('``registration_status=pending_manual_review``','``registration_status=automatic_scientific_gate_pending``')
          text=text.replace('registration is a separate human-reviewed change','registration remains disabled until the C3 automatic scientific gate exists')
          text=text.replace(
              '- no promotion, ever automatic: the review block is fixed\n  ``manual_review_required`` and promotion stays a human decision.',
              '- no lifecycle mutation in Stage-2: the proposal explicitly requires the C3\n  automatic scientific gate, while automatic registration/promotion remains disabled here.',
          )
          text=text.replace(
              'requires a new config id in a human-reviewed change.',
              'requires a new config id in an independently validated change.',
          )
          if text.count('REGISTRATION_STATUS = "pending_manual_review"')!=1:
              raise SystemExit('registration status anchor drifted')
          text=text.replace(
              'REGISTRATION_STATUS = "pending_manual_review"',
              'REGISTRATION_STATUS = "automatic_scientific_gate_pending"',
              1,
          )
          old='''        "learning_mode": "detached_offline_worker",\n        "manual_review_required": True,\n        **fields,\n'''
          new='''        "learning_mode": "detached_offline_worker",\n        "manual_review_required": False,\n        "human_approval_required": False,\n        "automatic_scientific_gate_required": True,\n        **fields,\n'''
          if text.count(old)!=1: raise SystemExit('result contract anchor drifted')
          text=text.replace(old,new,1)
          text=text.replace('"feasible_for_manual_evaluation"','"feasible_for_automatic_scientific_gate"')
          old='''        or proposal.get("manual_review_required") is not True\n        or proposal.get("generation_config_id") != GENERATION_CONFIG_ID\n'''
          new='''        or proposal.get("manual_review_required") is not False\n        or proposal.get("human_approval_required") is not False\n        or proposal.get("automatic_scientific_gate_required") is not True\n        or proposal.get("generation_config_id") != GENERATION_CONFIG_ID\n'''
          if text.count(old)!=1: raise SystemExit('proposal validation anchor drifted')
          text=text.replace(old,new,1)
          old='''        "review": {\n            "recommendation": "manual_review_required",\n            "registration": "not_registered",\n            "per_candidate": {\n                candidate["candidate_id"]: {\n                    "recommendation": "manual_review_required",\n                    "automatic_action": "none",\n                }\n                for candidate in candidates\n            },\n        },\n        "manual_review_required": True,\n        **projection._non_authority_fields(),\n'''
          new='''        "review": {\n            "recommendation": "automatic_scientific_gate_pending",\n            "registration": "not_registered",\n            "per_candidate": {\n                candidate["candidate_id"]: {\n                    "recommendation": "automatic_scientific_gate_pending",\n                    "automatic_action": "none",\n                }\n                for candidate in candidates\n            },\n        },\n        "manual_review_required": False,\n        "human_approval_required": False,\n        "automatic_scientific_gate_required": True,\n        **projection._non_authority_fields(),\n'''
          if text.count(old)!=1: raise SystemExit('proposal review block anchor drifted')
          text=text.replace(old,new,1)
          old='''        0\n        if result.get("manual_review_required") is True\n        and result.get("loop_stage") == GENERATOR_STAGE\n'''
          new='''        0\n        if result.get("manual_review_required") is False\n        and result.get("human_approval_required") is False\n        and result.get("automatic_scientific_gate_required") is True\n        and result.get("loop_stage") == GENERATOR_STAGE\n'''
          if text.count(old)!=1: raise SystemExit('exit-code anchor drifted')
          text=text.replace(old,new,1)
          gen.write_text(text,encoding='utf-8')

          test=Path('tests/test_crypto_ten_symbol_hypothesis_generator.py')
          t=test.read_text(encoding='utf-8')
          t=t.replace('"feasible_for_manual_evaluation"','"feasible_for_automatic_scientific_gate"')
          if t.count('assert result["manual_review_required"] is True')!=1:
              raise SystemExit('test manual-review anchor drifted')
          t=t.replace(
              'assert result["manual_review_required"] is True',
              'assert result["manual_review_required"] is False\n    assert result["human_approval_required"] is False\n    assert result["automatic_scientific_gate_required"] is True',
              1,
          )
          if t.count('assert proposal["review"]["recommendation"] == "manual_review_required"')!=1:
              raise SystemExit('test recommendation anchor drifted')
          t=t.replace(
              'assert proposal["review"]["recommendation"] == "manual_review_required"',
              'assert proposal["review"]["recommendation"] == "automatic_scientific_gate_pending"\n    assert proposal["manual_review_required"] is False\n    assert proposal["human_approval_required"] is False\n    assert proposal["automatic_scientific_gate_required"] is True',
              1,
          )
          test.write_text(t,encoding='utf-8')

          agents=Path('Crypto/AGENTS.md')
          a=agents.read_text(encoding='utf-8')
          a=a.replace(
              '`promotion.py` 是只读 scorecard，永久 `eligible_for_sim=false`、`promotion_authority=false`，不能自行晋级或扩风险。',
              '`promotion.py` 当前是 C2 只读 scorecard，固定 `eligible_for_sim=false`、`promotion_authority=false`；它等待 C3 simulation-only Challenger/Champion registry 与自动科学门实现，当前不能注册、晋级或扩风险。',
          )
          a=a.replace('`registration_status=pending_manual_review`，review 固定\n  `manual_review_required`','`registration_status=automatic_scientific_gate_pending`，并固定\n  `manual_review_required=false`、`human_approval_required=false`、`automatic_scientific_gate_required=true`')
          agents.write_text(a,encoding='utf-8')

          readme=Path('Crypto/README.md')
          r=readme.read_text(encoding='utf-8')
          r=r.replace('产出一份供人工评审的 immutable 注册提案 artifact。','产出一份等待 C3 自动科学门的 immutable 注册提案 artifact。')
          r=r.replace('`pending_manual_review`','`automatic_scientific_gate_pending`')
          r=r.replace('走人工评审。','走独立机器验证。')
          r=r.replace('feasible_for_manual_evaluation','feasible_for_automatic_scientific_gate')
          r=r.replace('可行性只影响人工评审\n  排序，不改变固定','可行性只为后续自动科学门提供排序/证据，不改变固定')
          r=r.replace('`review.recommendation=manual_review_required`（每候选同）。','`review.recommendation=automatic_scientific_gate_pending`（每候选同），并显式声明 `manual_review_required=false`、`human_approval_required=false`、`automatic_scientific_gate_required=true`。')
          r=r.replace('`manual_review_required` 不符即 2','自动科学门/非人工审批字段不符即 2')
          readme.write_text(r,encoding='utf-8')
          PY

          ! grep -R -nE 'pending_manual_review|feasible_for_manual_evaluation|recommendation.?[:=].?manual_review_required' Crypto/ten_symbol_hypothesis_generator.py Crypto/AGENTS.md Crypto/README.md tests/test_crypto_ten_symbol_hypothesis_generator.py
          git diff --check

      - name: Verify Stage-2 contract migration
        run: |
          set -euo pipefail
          REAL_TRADING_ENABLED=false python -m pytest -q tests/test_crypto_ten_symbol_hypothesis_generator.py
          python -m compileall -q Crypto/ten_symbol_hypothesis_generator.py

      - name: Commit durable migration and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-crypto-c3-pending-semantics.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: converge Crypto Stage-2 on automatic C3 gate semantics'
          git push origin HEAD:${{ github.head_ref }}
