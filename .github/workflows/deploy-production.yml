name: Deploy TradingAgent Production

on:
  workflow_run:
    workflows:
      - TradingAgent Tests
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: tradingagent-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -n "$DEPLOY_HOST" ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ -n "$DEPLOY_SSH_KEY" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]]

      - name: Download tested release artifact
        uses: actions/download-artifact@v5
        with:
          name: tradingagent-release-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify tested release artifact
        id: release
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifact"
          archive="$artifact_dir/tradingagent-${DEPLOY_SHA}.tar.gz"
          checksum_file="$artifact_dir/tradingagent-${DEPLOY_SHA}.tar.gz.sha256"

          test -f "$archive"
          test -f "$checksum_file"
          (
            cd "$artifact_dir"
            sha256sum -c "$(basename "$checksum_file")"
          )

          source_sha="$(tar -xOf "$archive" ./.source-sha | tr -d '\r\n')"
          [[ "$source_sha" == "$DEPLOY_SHA" ]]
          tar -tzf "$archive" \
            | grep -Fxq './front/dist-server/server/tradingAgentSnapshotHttp.js'

          checksum="$(awk 'NR == 1 {print $1}' "$checksum_file")"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Publish tested release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$DEPLOY_SHA" ]]; then
            echo "Skip stale deployment: tested=$DEPLOY_SHA current_main=$current_main_sha"
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$DEPLOY_PORT"
          )
          scp_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -P "$DEPLOY_PORT"
          )

          spool=/var/tmp/tradingagent-deploy
          archive_name="tradingagent-${DEPLOY_SHA}.tar.gz"
          request_file="$RUNNER_TEMP/tradingagent-deploy-request"
          printf '%s %s\n' "$DEPLOY_SHA" "$RELEASE_CHECKSUM" > "$request_file"
          chmod 0600 "$request_file"

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -x /usr/local/sbin/tradingagent-release && test -d '$spool'"

          scp "${scp_opts[@]}" \
            "$RELEASE_ARCHIVE" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${spool}/${archive_name}.incoming"
          scp "${scp_opts[@]}" \
            "$request_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${spool}/request.incoming"

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$DEPLOY_SHA" ]]; then
            echo "Main advanced during upload; discard incoming stale release without cutover."
            ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "rm -f '${spool}/${archive_name}.incoming' '${spool}/request.incoming'"
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; mv '${spool}/${archive_name}.incoming' '${spool}/${archive_name}'; mv '${spool}/request.incoming' '${spool}/request'; sudo -n /usr/local/sbin/tradingagent-release"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Verify deployed commit
        if: steps.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$DEPLOY_PORT"
          )

          deployed_sha="$(ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat /opt/investment/releases/tradingagent/current/.deployed-sha")"
          [[ "$deployed_sha" == "$DEPLOY_SHA" ]]
          echo "Verified production release: $deployed_sha"
