name: Automerge Trusted Agent PRs

on:
  workflow_run:
    workflows:
      - TradingAgent Tests
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  TRUSTED_PR_AUTHOR: NicholasHan1226

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge verified trusted PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$PRS_JSON")"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this successful workflow run."
            exit 0
          fi

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"

          [[ "$BASE_REF" == "main" ]] || { echo "Skip: base is not main."; exit 0; }
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo "Skip: fork PRs never auto-merge."; exit 0; }
          [[ "$AUTHOR" == "$TRUSTED_PR_AUTHOR" ]] || { echo "Skip: PR author is not trusted."; exit 0; }
          [[ "$DRAFT" == "false" ]] || { echo "Skip: draft PR."; exit 0; }
          [[ "$HEAD_SHA" == "$RUN_HEAD_SHA" ]] || { echo "Skip: tested SHA no longer matches PR head."; exit 0; }

          CHANGED_FILES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$CHANGED_FILES"; then
            echo "Skip: workflow-governance changes require a separate trusted controller merge."
            exit 0
          fi

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$BASE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            MAIN_CHANGED_FILES="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${CURRENT_MAIN_SHA}" --jq '.files[].filename')"

            NEED_FRESH_BASE=false
            if grep -Eq '^(AGENTS\.md$|CONTRIBUTING\.md$|\.github/|deploy/|shared/|requirements[^/]*$|pyproject\.toml$|front/package(-lock)?\.json$|docs/EVOLUTION_PROGRAM\.md$|docs/operations\.md$)' <<<"$CHANGED_FILES"; then
              NEED_FRESH_BASE=true
              echo "PR touches shared/governance/deployment authority and requires a fresh main base."
            fi

            OVERLAP="$(comm -12 \
              <(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | sort -u) \
              <(printf '%s\n' "$MAIN_CHANGED_FILES" | sed '/^$/d' | sort -u) || true)"
            if [[ -n "$OVERLAP" ]]; then
              NEED_FRESH_BASE=true
              echo "PR overlaps files changed on main since its base:"
              printf '%s\n' "$OVERLAP"
            fi

            if [[ "$NEED_FRESH_BASE" == "true" ]]; then
              gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
                -f expected_head_sha="$HEAD_SHA"
              echo "Branch update requested; CI must rerun on the refreshed head."
              exit 0
            fi

            echo "Main advanced only through disjoint, non-authority paths; preserve parallelism and merge the tested PR head."
          fi

          MERGE_JSON="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")"
          MERGED="$(jq -r '.merged // false' <<<"$MERGE_JSON")"
          MERGE_SHA="$(jq -r '.sha // empty' <<<"$MERGE_JSON")"
          [[ "$MERGED" == "true" ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]

          # A merge performed with GITHUB_TOKEN does not create a follow-up
          # push workflow run. workflow_dispatch is an explicit GitHub-supported
          # exception, so dispatch the exact new main SHA for post-merge tests,
          # release packaging and (when enabled) deployment.
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -f ref=main \
            -f "inputs[expected_sha]=$MERGE_SHA"
          echo "Dispatched exact-main validation for $MERGE_SHA"
