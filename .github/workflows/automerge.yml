name: Automerge Eligible M0 PRs

on:
  workflow_run:
    workflows:
      - TradingAgent Tests
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: read

env:
  TRUSTED_PR_AUTHOR: NicholasHan1226
  M0_AUTOMERGE_LABEL: automerge-m0

jobs:
  merge_m0:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge an eligible M0 candidate only
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$PRS_JSON")"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this successful workflow run."
            exit 0
          fi
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          labels="$(jq -r '.labels[].name' <<<"$pr_json")"

          [[ "$base_ref" == "main" ]] || { echo "Skip: base is not main."; exit 0; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo "Skip: fork PRs cannot use M0 automerge."; exit 0; }
          [[ "$author" == "$TRUSTED_PR_AUTHOR" ]] || { echo "Skip: PR author is not trusted."; exit 0; }
          [[ "$draft" == "false" ]] || { echo "Skip: draft PR."; exit 0; }
          [[ "$head_sha" == "$RUN_HEAD_SHA" ]] || { echo "Skip: tested SHA no longer matches PR head."; exit 0; }
          grep -Fxq "$M0_AUTOMERGE_LABEL" <<<"$labels" || { echo "Skip: no explicit M0 automerge label."; exit 0; }

          changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          [[ -n "$changed_files" ]]
          if grep -Ev '^(docs/|tests/|.*\.md$)' <<<"$changed_files"; then
            echo "Skip: M0 automerge is limited to docs and tests."
            exit 0
          fi

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$base_sha" == "$current_main_sha" ]] || {
            echo "Skip: M0 candidate must be tested on the current main base."
            exit 0
          }

          merge_json="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$head_sha")"
          merge_sha="$(jq -r '.sha // empty' <<<"$merge_json")"
          [[ "$(jq -r '.merged // false' <<<"$merge_json")" == "true" ]]
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]

          # A GITHUB_TOKEN merge does not emit a push workflow run. Exact-main
          # validation is dispatched for the merge SHA, but deployment remains
          # impossible unless the Controller later sends controller-accepted-deploy.
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -f ref=main \
            -f "inputs[expected_sha]=$merge_sha"
          echo "Merged eligible M0 PR #${PR_NUMBER}; dispatched exact-main validation for ${merge_sha}."
