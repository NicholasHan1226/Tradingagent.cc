name: TradingAgent Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tradingagent-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TRADINGDATAS_API_URL: ""
          SHAREDSIGNALS_API_URL: ""
          MARKETGRAPH_API_URL: ""
          REAL_TRADING_ENABLED: "false"
          TRADINGAGENT_LLM_NETWORK_ENABLED: "false"
          WEBHOOK_SECRET: "ci-test-placeholder"
        run: python -m pytest tests/ -q --tb=short -W default::RuntimeWarning

  front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend and read-only API
        env:
          REAL_TRADING_ENABLED: "false"
          TRADINGAGENT_LLM_NETWORK_ENABLED: "false"
          TRADINGDATAS_API_URL: ""
          SHAREDSIGNALS_API_URL: ""
          MARKETGRAPH_API_URL: ""
        run: npm run build:all
