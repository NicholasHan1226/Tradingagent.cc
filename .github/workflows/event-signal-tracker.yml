name: A-share Event Signal Tracker

# Research-only rolling tracker for the event-calendar study signals:
# lockup oversold-rebound, disclosure positive drift and disclosure
# negative relief.  Scheduled runs (weekly, Monday) were authorized by
# Nicholas on 2026-08-24 and replace the previous manual-dispatch-only
# posture; manual dispatch remains available.  The TUSHARE_MCP_TOKEN
# repository secret is required either way; without it the job fails
# closed with TOKEN_MISSING.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Track events on/after this date (YYYYMMDD)"
        default: "20260401"
  schedule:
    # Weekly Monday 13:23 UTC = 21:23 Beijing, after the evening
    # announcement window; off-minute to avoid shared-hour load spikes.
    - cron: "23 13 * * 1"

permissions:
  contents: read

concurrency:
  group: event-signal-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # 90min absorbs the one-time top-1000 backfill (~800 new symbols across
    # four data surfaces); steady-state weekly runs finish in ~15min.  Still
    # a bounded weekly job (schedule contract test pins this ceiling).
    timeout-minutes: 90
    env:
      RESEARCH_CACHE: /tmp/ashare_event_research
      RUNTIME_STATE: /tmp/ashare_tracker_state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore research cache and tracker state
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ashare_event_research
            /tmp/ashare_tracker_state
          key: ashare-event-research-${{ github.run_id }}
          restore-keys: |
            ashare-event-research-

      - name: Refresh research data (Tushare incremental over cache)
        env:
          TUSHARE_MCP_TOKEN: ${{ secrets.TUSHARE_MCP_TOKEN }}
        run: |
          # event_calendar_fetch writes CACHE_DIR=/tmp/ashare_event_research,
          # matching RESEARCH_CACHE above.  --refresh-disclosure sweeps every
          # quarter/year report period exactly (~40 calls): reuse-if-present
          # would freeze forward earnings windows at the week the cache was
          # built, and year-sliced range pulls silently capture ONLY annual
          # periods on this endpoint — both starve the earnings signals.
          python3 Ashare/event_calendar_fetch.py --refresh-disclosure

      - name: Backfill tracked-universe data (idempotent)
        env:
          TUSHARE_MCP_TOKEN: ${{ secrets.TUSHARE_MCP_TOKEN }}
        run: |
          # The tracker runs on the top-1000 mainboard expansion universe.
          # Each sub-step is idempotent over the persisted cache:
          # expand_samples refreshes stale bar/adjfactor shards (>6 days),
          # re-pulls every ranked symbol's share_float history into the
          # single lockup table (dedupe by batch identity), then
          # refresh_share_float backstops codes outside the ranked list,
          # and dailybasic refreshes missing or stale (>6 days) per-symbol
          # label shards so valuation labels never age past a week.  The
          # first run after a universe expansion backfills everything;
          # steady-state weekly runs cost ~15-25min.
          python3 Ashare/event_calendar_expand_samples.py --limit 1000
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from Ashare.event_paper_baseline_sim import refresh_share_float
          n = refresh_share_float(Path('$RESEARCH_CACHE'))
          print(f'share_float refreshed for {n} symbols')
          "
          python3 Ashare/event_dailybasic_fetch.py

      - name: Ensure earnings-forecast cache (freshness-aware over universe)
        env:
          TUSHARE_MCP_TOKEN: ${{ secrets.TUSHARE_MCP_TOKEN }}
        run: |
          # forecast.csv (earliest pre-disclosure forecast per report period)
          # drives the earnings signals' direction mapping;
          # ensure_forecast_cache fetches symbols missing from the file and
          # full-history re-pulls everything when the stored newest
          # announcement goes stale (>6 days), so forecasts a covered symbol
          # publishes later still reach their disclosure events.  Persisted
          # by the actions/cache step above.
          python3 -c "
          import csv, sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from Ashare.event_calendar_earnings_groups import ensure_forecast_cache
          cache = Path('$RESEARCH_CACHE')
          name = 'sample_symbols_expanded'
          if not (cache / f'{name}.csv').exists():
              name = 'sample_symbols'
          with (cache / f'{name}.csv').open(encoding='utf-8') as handle:
              samples = {row['ts_code'] for row in csv.DictReader(handle)}
          print(f'universe={name} samples={len(samples)}')
          path = ensure_forecast_cache(cache, samples)
          print(f'forecast cache ready -> {path}')
          "

      - name: Run event signal tracker (all three signals)
        run: |
          mkdir -p "$RUNTIME_STATE"
          python3 Ashare/event_signal_lockup_tracker.py \
            --cache "$RESEARCH_CACHE" \
            --journal "$RUNTIME_STATE/sample_journal.jsonl" \
            --since "${{ inputs.since || '20260401' }}" \
            --signals lockup,earnings_pos,earnings_neg \
            --expanded

      - name: Stop in-flight fetchers for a stable snapshot
        # Cancellation leaves the current fetcher alive until job cleanup
        # (the runner only reaps orphans at Complete job), and tar fails
        # with exit 1 when files change mid-archive — the first cancel-safe
        # save attempt died exactly this way.  Quiesce writers first; every
        # sub-step is idempotent, so killing one mid-flight costs nothing
        # beyond the rows it had not yet written.
        if: ${{ failure() || cancelled() }}
        run: |
          pkill -f 'Ashare[./]event' 2>/dev/null || true
          sleep 2
          pkill -9 -f 'Ashare[./]event' 2>/dev/null || true

      - name: Persist partial research data on early exit
        # Every data sub-step writes incrementally to the cache dirs and is
        # idempotent on rerun (freshness gates, dedupe keys, skip-existing),
        # so the only way progress can be lost is a timeout killing the job
        # before actions/cache's post step — which runs on success only.
        # This explicit save snapshots whatever reached disk at cancel time
        # under a distinct key; restore-keys prefix matching picks it up on
        # the next run, turning a cold-start timeout into a resumable one.
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/ashare_event_research
            /tmp/ashare_tracker_state
          key: ashare-event-research-${{ github.run_id }}-partial

      - name: Archive tracker report and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-report-${{ github.run_number }}
          path: |
            /tmp/ashare_tracker_state/
          retention-days: 90
          if-no-files-found: warn
