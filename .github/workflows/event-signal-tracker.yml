name: A-share Event Signal Tracker

# Research-only rolling tracker for the event-calendar study signals:
# lockup oversold-rebound, disclosure positive drift and disclosure
# negative relief.  Scheduled runs (weekly, Monday) were authorized by
# Nicholas on 2026-08-24 and replace the previous manual-dispatch-only
# posture; manual dispatch remains available.  The TUSHARE_MCP_TOKEN
# repository secret is required either way; without it the job fails
# closed with TOKEN_MISSING.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Track events on/after this date (YYYYMMDD)"
        default: "20260401"
  schedule:
    # Weekly Monday 13:23 UTC = 21:23 Beijing, after the evening
    # announcement window; off-minute to avoid shared-hour load spikes.
    - cron: "23 13 * * 1"

permissions:
  contents: read

concurrency:
  group: event-signal-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_CACHE: /tmp/ashare_event_research
      RUNTIME_STATE: /tmp/ashare_tracker_state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore research cache and tracker state
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ashare_event_research
            /tmp/ashare_tracker_state
          key: ashare-event-research-${{ github.run_id }}
          restore-keys: |
            ashare-event-research-

      - name: Refresh research data (Tushare incremental over cache)
        env:
          TUSHARE_MCP_TOKEN: ${{ secrets.TUSHARE_MCP_TOKEN }}
        run: |
          # event_calendar_fetch writes CACHE_DIR=/tmp/ashare_event_research,
          # matching RESEARCH_CACHE above, and reuses cached files when present.
          python3 Ashare/event_calendar_fetch.py

      - name: Ensure earnings-forecast cache (once, then reused)
        env:
          TUSHARE_MCP_TOKEN: ${{ secrets.TUSHARE_MCP_TOKEN }}
        run: |
          # forecast.csv (earliest pre-disclosure forecast per report period)
          # is needed for the earnings signals; ensure_forecast_cache fetches
          # per symbol only when the file is absent and is persisted by the
          # actions/cache step above.
          python3 -c "
          import csv, sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from Ashare.event_calendar_earnings_groups import ensure_forecast_cache
          cache = Path('$RESEARCH_CACHE')
          with (cache / 'sample_symbols.csv').open(encoding='utf-8') as handle:
              samples = {row['ts_code'] for row in csv.DictReader(handle)}
          print(f'samples={len(samples)}')
          path = ensure_forecast_cache(cache, samples)
          print(f'forecast cache ready -> {path}')
          "

      - name: Run event signal tracker (all three signals)
        run: |
          mkdir -p "$RUNTIME_STATE"
          python3 Ashare/event_signal_lockup_tracker.py \
            --cache "$RESEARCH_CACHE" \
            --journal "$RUNTIME_STATE/sample_journal.jsonl" \
            --since "${{ inputs.since || '20260401' }}" \
            --signals lockup,earnings_pos,earnings_neg

      - name: Archive tracker report and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-report-${{ github.run_number }}
          path: |
            /tmp/ashare_tracker_state/
          retention-days: 90
          if-no-files-found: warn
