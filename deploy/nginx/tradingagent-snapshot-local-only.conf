# Replace only the snapshot location in the existing tradingagent-front site.
# No trusted real-IP rewriting: access is decided from the connection peer.
location = /api/trading-agent/snapshot {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    limit_req zone=api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787/api/trading-agent/snapshot;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}
