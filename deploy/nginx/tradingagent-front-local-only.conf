# Whole-site private origin. Remote use requires a separately verified
# Nicholas-only authenticated edge; never expose this loopback trust via
# an unprotected tunnel or rewrite the connection peer with real_ip_header.
server {
    listen 80;
    server_name dashboard.tradingagent.cc tradingagent.cc www.tradingagent.cc;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    root /opt/investment/releases/tradingagent/current/front/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }
    location = /api/trading-agent/snapshot {
        limit_except GET { deny all; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787/api/trading-agent/snapshot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
