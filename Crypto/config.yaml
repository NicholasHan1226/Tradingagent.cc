market: crypto
capital:
  default_layer: simulated
  # Writable Crypto shadow paths are retired. Historical shadow artifacts are
  # read-only evidence; the local fixture candidate writes simulated only.
  allowed_layers: [simulated]
  currency: USDT
safety:
  real_money_enabled: false
  live_broker_enabled: false
  direct_execution_enabled: false
data:
  reader: tradingdatas_v1_catalog_query
  # Candidate dataset IDs are injected only by fixture/test profiles until
  # TradingDatas main and its formal internal catalog endpoint are read back.
  binding_scope: fixture_only
universe:
  max_symbols: 50
  min_close: 0.00000001
  active_only: true
session:
  timezone: UTC
  type: 24x7
risk:
  max_positions: 2
  max_single_position_pct: 0.15
fees:
  taker_bps: 10
  maker_bps: 8
reporting:
  daily_report_path: shared/review/crypto/daily
  notify_on_trigger_only: true
promotion:
  # Read-only historical scorecard thresholds; never an activation policy.
  min_shadow_trades: 50
  min_positive_days_pct: 0.55
