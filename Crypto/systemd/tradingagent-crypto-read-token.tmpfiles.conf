# Recreate the publisher-provisioned TradingDatas Crypto read token in tmpfs.
# This rule copies bytes from the root-owned canonical source without exposing
# them to the repository, logs, manifest, or command line.
C /run/secrets/tradingagent/tradingdatas-crypto-read.token 0600 tradingagent tradingagent - /etc/tradingagent/tradingdatas-crypto-read.token
